# Worker de assets estáticos: no hay código de servidor, sólo el dist/ de Astro.
# El proyecto en Cloudflare es un Worker (no un proyecto de Pages), así que el
# comando correcto es `wrangler deploy`, nunca `wrangler pages deploy`.
name = "dr-ulises-torres-cardiologia"
# Un día por detrás de hoy a propósito: con la fecha de hoy el runtime que
# trae wrangler todavía no la soporta y `wrangler dev` no arranca, aunque en
# la nube funcione.
compatibility_date = "2026-10-19"

[assets]
directory = "./dist"
